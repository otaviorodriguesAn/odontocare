
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OdontoCare - Cadastrar</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS da página -->
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card card-register shadow-sm p-4 bg-white my-4">

    <!-- CABEÇALHO DA MARCA -->
    <div class="text-center mb-4">

        <div class="brand-icon mb-1">
            <i class="bi bi-hospital"></i>
        </div>

        <h3 class="fw-bold text-dark m-0">
            Odonto<span class="text-primary">Care</span>
        </h3>

        <p class="text-muted small mb-0">
            Crie sua conta para começar
        </p>

    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form th:action="@{/cadastro}"
          th:object="${clienteCadastro}"
          method="post">

        <!-- ERROS GERAIS -->
        <div class="alert alert-danger"
             th:if="${#fields.hasGlobalErrors()}">

            <p class="mb-0"
               th:each="erro : ${#fields.globalErrors()}"
               th:text="${erro}">
            </p>

        </div>

        <!-- NOME COMPLETO -->
        <div class="mb-3">

            <label for="nome"
                   class="form-label text-secondary small fw-medium">
                Nome completo
            </label>

            <div class="input-group">

                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-person text-muted"></i>
                </span>

                <input type="text"
                       th:field="*{nome}"
                       id="nome"
                       class="form-control bg-light border-start-0"
                       placeholder="Seu nome completo">

            </div>

            <small class="text-danger"
                   th:if="${#fields.hasErrors('nome')}"
                   th:errors="*{nome}">
            </small>

        </div>

        <!-- E-MAIL -->
        <div class="mb-3">

            <label for="email"
                   class="form-label text-secondary small fw-medium">
                E-mail
            </label>

            <div class="input-group">

                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-envelope text-muted"></i>
                </span>

                <input type="email"
                       th:field="*{email}"
                       id="email"
                       class="form-control bg-light border-start-0"
                       placeholder="seu@email.com">

            </div>

            <small class="text-danger"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
            </small>

        </div>

        <!-- SENHA -->
        <div class="mb-3">

            <label for="senha"
                   class="form-label text-secondary small fw-medium">
                Senha
            </label>

            <div class="input-group">

                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                </span>

                <input type="password"
                       th:field="*{senha}"
                       id="senha"
                       class="form-control bg-light border-start-0"
                       placeholder="Crie uma senha">

            </div>

            <small class="text-danger"
                   th:if="${#fields.hasErrors('senha')}"
                   th:errors="*{senha}">
            </small>

        </div>

        <!-- CONFIRMAR SENHA -->
        <div class="mb-3">

            <label for="confirmarSenha"
                   class="form-label text-secondary small fw-medium">
                Confirmar senha
            </label>

            <div class="input-group">

                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-shield-lock text-muted"></i>
                </span>

                <input type="password"
                       th:field="*{confirmarSenha}"
                       id="confirmarSenha"
                       class="form-control bg-light border-start-0"
                       placeholder="Repita a senha">

            </div>

            <small class="text-danger"
                   th:if="${#fields.hasErrors('confirmarSenha')}"
                   th:errors="*{confirmarSenha}">
            </small>

        </div>

        <!-- TERMOS DE USO -->
        <div class="form-check mb-4">

            <input type="checkbox"
                   class="form-check-input"
                   id="terms"
                   required>

            <label class="form-check-label text-muted small"
                   for="terms">

                Concordo com os
                <a href="#"
                   class="text-primary text-decoration-none">
                    Termos de uso
                </a>
                e
                <a href="#"
                   class="text-primary text-decoration-none">
                    Privacidade
                </a>

            </label>

        </div>

        <!-- BOTÃO CADASTRAR -->
        <button type="submit"
                class="btn btn-primary w-100 rounded-2 fw-semibold">
            Cadastrar
        </button>

    </form>

    <!-- RODAPÉ -->
    <div class="text-center mt-4 pt-3 border-top">

        <p class="text-muted small mb-0">
            Já possui uma conta?

            <a th:href="@{/login}"
               class="text-primary text-decoration-none fw-semibold">
                Fazer Login
            </a>
        </p>

    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
