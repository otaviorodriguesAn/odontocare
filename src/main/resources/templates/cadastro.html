<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoCare - Cadastrar</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card card-register shadow-sm p-4 bg-white my-4">
    <!-- CABEÇALHO DA MARCA -->
    <div class="text-center mb-4">
        <div class="brand-icon mb-1">
            <i class="bi bi-hospital"></i>
        </div>
        <h3 class="fw-bold text-dark m-0">Odonto<span class="text-primary">Care</span></h3>
        <p class="text-muted small mb-0">Crie sua conta para começar</p>
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form>
        <!-- NOME COMPLETO -->
        <div class="mb-3">
            <label for="name" class="form-label text-secondary small fw-medium">Nome completo</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control bg-light border-start-0" id="name" placeholder="Seu nome completo" required>
            </div>
        </div>

        <!-- E-MAIL -->
        <div class="mb-3">
            <label for="email" class="form-label text-secondary small fw-medium">E-mail</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0" id="email" placeholder="seu@email.com" required>
            </div>
        </div>

        <!-- SENHA -->
        <div class="mb-3">
            <label for="password" class="form-label text-secondary small fw-medium">Senha</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="password" placeholder="Crie uma senha" required>
            </div>
        </div>

        <!-- CONFIRMAR SENHA -->
        <div class="mb-3">
            <label for="confirmPassword" class="form-label text-secondary small fw-medium">Confirmar senha</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="confirmPassword" placeholder="Repita a senha" required>
            </div>
        </div>

        <!-- TERMOS DE USO -->
        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="terms" required>
            <label class="form-check-label text-muted small" for="terms">
                Concordo com os <a href="#" class="text-primary text-decoration-none">Termos de uso</a> e <a href="#" class="text-primary text-decoration-none">Privacidade</a>
            </label>
        </div>

        <!-- BOTÃO CADASTRAR -->
        <button type="submit" class="btn btn-primary w-100 rounded-2 fw-semibold">Cadastrar</button>
    </form>

    <!-- RODAPÉ -->
    <div class="text-center mt-4 pt-3 border-top">
        <p class="text-muted small mb-0">Já possui uma conta? <a  th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Fazer Login</a></p>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
