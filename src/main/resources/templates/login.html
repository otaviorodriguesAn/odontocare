<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdontoCare - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
        }
        .brand-icon {
            font-size: 3rem;
            color: #0d6efd;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 0.6rem;
            font-weight: 500;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="card card-login shadow-sm p-4 bg-white">
    <!-- CABEÇALHO DA MARCA -->
    <div class="text-center mb-4">
        <div class="brand-icon mb-2">
            <i class="bi bi-hospital"></i>
        </div>
        <h3 class="fw-bold text-dark m-0">Odonto<span class="text-primary">Care</span></h3>
        <p class="text-muted small">Acesse sua conta para continuar</p>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form th:action="@{/login}" method="post">
        <!-- CADASTRO REALIZADO -->
        <div class="alert alert-success"
             th:if="${param.cadastro != null}">

            Cadastro realizado com sucesso!
            Faça login para continuar.

        </div>

        <!-- ERRO DE LOGIN -->
        <div class="alert alert-danger"
             th:if="${param.erro != null}">

            E-mail ou senha incorretos.
            Verifique seus dados e tente novamente.

        </div>
        <!-- E-MAIL -->
        <div class="mb-3">

            <label for="email"
                   class="form-label text-secondary small fw-medium">
                E-mail
            </label>

            <div class="input-group">

            <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-envelope text-muted"></i>
            </span>

                <input
                        type="email"
                        class="form-control bg-light border-start-0"
                        id="email"
                        name="username"
                        placeholder="seu@email.com"
                        required>

            </div>

        </div>

        <!-- SENHA -->
        <div class="mb-3">

            <label for="password"
                   class="form-label text-secondary small fw-medium">
                Senha
            </label>

            <div class="input-group">

            <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-lock text-muted"></i>
            </span>

                <input
                        type="password"
                        class="form-control bg-light border-start-0"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        required>

            </div>

        </div>

        <!-- LEMBRAR -->
        <div class="form-check mb-4">

            <input
                    type="checkbox"
                    class="form-check-input"
                    id="remember"
                    name="remember-me">

            <label class="form-check-label text-muted small"
                   for="remember">
                Lembrar-me
            </label>

        </div>

        <!-- BOTÃO -->
        <button type="submit"
                class="btn btn-primary w-100 rounded-2">

            Entrar

        </button>

    </form>
    <!-- RODAPÉ -->
    <div class="text-center mt-4 pt-3 border-top">
        <p class="text-muted small mb-0">Ainda não tem conta? <a  th:href="@{/cadastro}" class="text-primary text-decoration-none fw-semibold">Cadastre-se</a></p>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
